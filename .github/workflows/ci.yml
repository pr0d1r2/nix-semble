---
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: pr0d1r2/nix-lefthook-ci-action@9fd689df8098290d9bbff25d68c8ca9cddfbcee0
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

  build-darwin:
    needs: build-linux
    runs-on: macos-latest
    steps:
      - uses: pr0d1r2/nix-lefthook-ci-action@9fd689df8098290d9bbff25d68c8ca9cddfbcee0
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

  build-linux-arm:
    needs: build-linux
    # Native ARM runner: the action runs `nix build` for the host system, so
    # an x86_64 runner with extra-platforms never builds aarch64-linux.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: pr0d1r2/nix-lefthook-ci-action@9fd689df8098290d9bbff25d68c8ca9cddfbcee0
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
